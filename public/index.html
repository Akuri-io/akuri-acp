<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuri ACP - Dashboard</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/admin/css/styles.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold text-primary">Akuri ACP</h1>
            <p class="text-sm text-gray-400">Configuration Dashboard</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-6">
        <!-- Navigation -->
        <div class="border-b border-gray-700 mb-6">
            <nav class="flex space-x-4">
                <a href="/admin/rutas"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📁 Rutas
                </a>
                <a href="/admin/extensiones"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    🔧 Extensiones
                </a>
                <a href="/admin"
                    class="px-4 py-2 font-medium border-b-2 border-primary text-primary transition-colors">
                    📊 Métricas
                </a>
                <a href="/admin/install"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📥 Instalación
                </a>
            </nav>
        </div>

        <!-- Content -->
        <div>
            <h2 class="text-xl font-semibold mb-4">Métricas y Estado del Sistema</h2>

            <!-- Cards de Resumen -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="text-gray-400 text-sm mb-2">Documentos Indexados</div>
                    <div class="text-3xl font-bold text-primary">0</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="text-gray-400 text-sm mb-2">Búsquedas Realizadas</div>
                    <div class="text-3xl font-bold text-success">0</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="text-gray-400 text-sm mb-2">Tiempo Promedio</div>
                    <div class="text-3xl font-bold text-gray-100">0ms</div>
                </div>
                <div class="bg-gray-800 rounded-lg p-6">
                    <div class="text-gray-400 text-sm mb-2">Última Indexación</div>
                    <div class="text-sm font-medium text-gray-300">-</div>
                </div>
            </div>

            <!-- Estado de Ingesta -->
            <div class="bg-gray-800 rounded-lg p-6">
                <h3 class="text-lg font-medium mb-4">Estado de Ingesta de PDFs</h3>
                <div class="text-gray-400 text-sm">No hay archivos en proceso</div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

    <script type="module">
        import { ui } from '/admin/js/ui.js';

        // Placeholder for metrics logic
        console.log('Dashboard loaded');
    </script>
</body>

</html>
