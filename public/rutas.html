<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuri ACP - Rutas</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/admin/css/styles.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold text-primary">Akuri ACP</h1>
            <p class="text-sm text-gray-400">Configuration Dashboard</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-6">
        <!-- Navigation -->
        <div class="border-b border-gray-700 mb-6">
            <nav class="flex space-x-4">
                <a href="/admin/rutas"
                    class="px-4 py-2 font-medium border-b-2 border-primary text-primary transition-colors">
                    📁 Rutas
                </a>
                <a href="/admin/extensiones"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    🔧 Extensiones
                </a>
                <a href="/admin"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📊 Métricas
                </a>
                <a href="/admin/install"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📥 Instalación
                </a>
            </nav>
        </div>

        <!-- Content -->
        <div>
            <h2 class="text-xl font-semibold mb-4">Gestión de Rutas de Documentación</h2>

            <!-- Tabla de Rutas -->
            <div class="bg-gray-800 rounded-lg p-6 mb-6">
                <h3 class="text-lg font-medium mb-4">Rutas Configuradas</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="border-b border-gray-700">
                            <tr>
                                <th class="pb-3 pr-4">Ruta</th>
                                <th class="pb-3 pr-4">Estado</th>
                                <th class="pb-3 pr-4">Documentos</th>
                                <th class="pb-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="paths-table-body" class="divide-y divide-gray-700">
                            <tr>
                                <td colspan="4" class="py-4 text-gray-400 text-center">Cargando rutas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Formulario Agregar Ruta -->
            <div class="bg-gray-800 rounded-lg p-6 mb-6">
                <h3 class="text-lg font-medium mb-4">Agregar Nueva Ruta</h3>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <input type="text" id="new-path-input" placeholder="/ruta/a/documentos"
                            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <div id="path-validation-message" class="mt-2 text-sm"></div>
                    </div>
                    <button id="validate-btn"
                        class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">
                        Validar
                    </button>
                    <button id="add-path-button" disabled
                        class="px-6 py-2 bg-primary hover:bg-blue-600 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                        Agregar
                    </button>
                </div>
            </div>

            <!-- Acciones Globales -->
            <div class="flex gap-4">
                <button id="save-btn"
                    class="px-6 py-3 bg-success hover:bg-green-600 rounded-lg font-medium transition-colors">
                    💾 Guardar Configuración
                </button>
                <button id="reindex-btn"
                    class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium transition-colors">
                    🔄 Reindexar Todo
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

    <script type="module">
        import { api } from '/admin/js/api.js';
        import { ui } from '/admin/js/ui.js';

        let pathValidationResult = null;

        // Load paths
        async function loadPaths() {
            try {
                const data = await api.getPaths();
                renderPathsTable(data.paths || []);
            } catch (error) {
                ui.showToast('Error cargando rutas: ' + error.message, 'error');
            }
        }

        function renderPathsTable(paths) {
            const tbody = document.getElementById('paths-table-body');
            if (paths.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-4 text-gray-400 text-center">No hay rutas configuradas</td></tr>';
                return;
            }

            tbody.innerHTML = paths.map(pathInfo => `
                <tr>
                    <td class="py-3 pr-4 font-mono text-sm">${pathInfo.path}</td>
                    <td class="py-3 pr-4">
                        <span class="px-2 py-1 bg-success/20 text-success rounded text-xs">✓ Válida</span>
                    </td>
                    <td class="py-3 pr-4 text-gray-300">${pathInfo.documentCount || 0}</td>
                    <td class="py-3">
                        <button data-path="${pathInfo.path}" class="delete-btn text-error hover:text-red-400 text-sm">
                            Eliminar
                        </button>
                    </td>
                </tr>
            `).join('');

            // Add event listeners to delete buttons
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', () => removePath(btn.dataset.path));
            });
        }

        // Validate path
        async function validatePath() {
            const input = document.getElementById('new-path-input');
            const message = document.getElementById('path-validation-message');
            const addButton = document.getElementById('add-path-button');
            const path = input.value.trim();

            if (!path) {
                message.innerHTML = '';
                addButton.disabled = true;
                return;
            }

            message.innerHTML = '<span class="text-gray-400">⏳ Validando...</span>';
            addButton.disabled = true;

            try {
                const result = await api.validatePath(path);
                pathValidationResult = result;

                if (result.valid) {
                    message.innerHTML = `<span class="text-success">✓ ${result.message}</span>`;
                    addButton.disabled = false;
                } else {
                    message.innerHTML = `<span class="text-error">✗ ${result.message}</span>`;
                    addButton.disabled = true;
                }
            } catch (error) {
                message.innerHTML = `<span class="text-error">✗ Error validando ruta</span>`;
                addButton.disabled = true;
            }
        }

        // Add path
        async function addPath() {
            const input = document.getElementById('new-path-input');
            const path = input.value.trim();

            if (!path || !pathValidationResult?.valid) return;

            try {
                const result = await api.addPath(path);

                if (result.success) {
                    ui.showToast(result.message, 'success');
                    input.value = '';
                    document.getElementById('path-validation-message').innerHTML = '';
                    document.getElementById('add-path-button').disabled = true;
                    pathValidationResult = null;
                    loadPaths();
                } else {
                    ui.showToast('Error: ' + result.message, 'error');
                }
            } catch (error) {
                ui.showToast('Error agregando ruta: ' + error.message, 'error');
            }
        }

        // Remove path
        async function removePath(path) {
            if (!confirm(`¿Eliminar la ruta "${path}"?`)) return;

            try {
                const result = await api.removePath(path);

                if (result.success) {
                    ui.showToast('Ruta eliminada', 'success');
                    loadPaths();
                } else {
                    ui.showToast('Error eliminando ruta', 'error');
                }
            } catch (error) {
                ui.showToast('Error: ' + error.message, 'error');
            }
        }

        // Reindex
        async function reindexAll() {
            if (!confirm('¿Reindexar todos los documentos? Esto puede tomar tiempo.')) return;

            try {
                const result = await api.reindexAll();
                if (result.success) {
                    ui.showToast(`Reindexación completada: ${result.totalDocs} documentos`, 'success');
                } else {
                    ui.showToast('Error en reindexación', 'error');
                }
            } catch (error) {
                ui.showToast('Error: ' + error.message, 'error');
            }
        }

        // Event Listeners
        document.getElementById('validate-btn').addEventListener('click', validatePath);
        document.getElementById('add-path-button').addEventListener('click', addPath);
        document.getElementById('new-path-input').addEventListener('blur', validatePath);
        document.getElementById('reindex-btn').addEventListener('click', reindexAll);
        document.getElementById('save-btn').addEventListener('click', () => ui.showToast('Configuración guardada', 'success'));

        // Init
        loadPaths();
    </script>
</body>

</html>
