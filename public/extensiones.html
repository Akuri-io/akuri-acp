<!DOCTYPE html>
<html lang="es" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akuri ACP - Extensiones</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/admin/css/styles.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-gray-800 border-b border-gray-700">
        <div class="container mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold text-primary">Akuri ACP</h1>
            <p class="text-sm text-gray-400">Configuration Dashboard</p>
        </div>
    </header>

    <!-- Main Container -->
    <div class="container mx-auto px-4 py-6">
        <!-- Navigation -->
        <div class="border-b border-gray-700 mb-6">
            <nav class="flex space-x-4">
                <a href="/admin/rutas"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📁 Rutas
                </a>
                <a href="/admin/extensiones"
                    class="px-4 py-2 font-medium border-b-2 border-primary text-primary transition-colors">
                    🔧 Extensiones
                </a>
                <a href="/admin"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📊 Métricas
                </a>
                <a href="/admin/install"
                    class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
                    📥 Instalación
                </a>
            </nav>
        </div>

        <!-- Content -->
        <div>
            <h2 class="text-xl font-semibold mb-4">Configuración de Extensiones</h2>

            <!-- Extensiones Permitidas -->
            <div class="bg-gray-800 rounded-lg p-6 mb-6">
                <h3 class="text-lg font-medium mb-4">Extensiones Permitidas</h3>
                <div id="extensions-container" class="flex flex-wrap gap-2 mb-4">
                    <span class="px-3 py-1 bg-primary/20 text-primary rounded-full text-sm">.md</span>
                    <span class="px-3 py-1 bg-primary/20 text-primary rounded-full text-sm">.pdf</span>
                    <span class="px-3 py-1 bg-primary/20 text-primary rounded-full text-sm">.txt</span>
                </div>
                <button class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg text-sm transition-colors">
                    + Agregar Extensión
                </button>
            </div>

            <!-- Pesos de Búsqueda -->
            <div class="bg-gray-800 rounded-lg p-6">
                <h3 class="text-lg font-medium mb-4">Pesos de Búsqueda (Boosting)</h3>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm mb-2">Proyecto: <span class="text-primary">2.0x</span></label>
                        <input type="range" min="1" max="3" step="0.1" value="2.0" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Workspace: <span class="text-primary">1.5x</span></label>
                        <input type="range" min="1" max="2" step="0.1" value="1.5" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">General: <span class="text-primary">1.0x</span></label>
                        <input type="range" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full">
                    </div>
                    <div>
                        <label class="block text-sm mb-2">Interno: <span class="text-primary">0.8x</span></label>
                        <input type="range" min="0.5" max="1" step="0.1" value="0.8" class="w-full">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

    <script type="module">
        import { ui } from '/admin/js/ui.js';

        // Placeholder for future logic
        console.log('Extensiones page loaded');
    </script>
</body>

</html>
