<!DOCTYPE html>
<html lang="es" class="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akuri ACP - Paths</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/admin/css/styles.css">
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen">
  <!-- Header -->
  <header class="bg-gray-800 border-b border-gray-700">
    <div class="container mx-auto px-4 py-4">
      <h1 class="text-2xl font-bold text-primary">Akuri ACP</h1>
      <p class="text-sm text-gray-400">Configuration Dashboard</p>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container mx-auto px-4 py-6">
    <!-- Navigation -->
    <div class="border-b border-gray-700 mb-6">
      <nav class="flex space-x-4">
        <a href="/admin/paths" class="px-4 py-2 font-medium border-b-2 border-primary text-primary transition-colors">
          📁 Paths
        </a>
        <a href="/admin/extensions"
          class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
          🔧 Extensions
        </a>
        <a href="/admin/config"
          class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
          ⚙️ Configuration
        </a>
        <a href="/admin/install"
          class="px-4 py-2 font-medium border-b-2 border-transparent text-gray-400 hover:border-primary hover:text-gray-200 transition-colors">
          📥 Installation
        </a>
      </nav>
    </div>

    <!-- Content -->
    <div>
      <h2 class="text-xl font-semibold mb-4">Documentation Paths Management</h2>

      <!-- Paths Table -->
      <div class="bg-gray-800 rounded-lg p-6 mb-6">
        <h3 class="text-lg font-medium mb-4">Configured Paths</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead class="border-b border-gray-700">
              <tr>
                <th class="pb-3 pr-4">Type</th>
                <th class="pb-3 pr-4">Name</th>
                <th class="pb-3 pr-4">Path</th>
                <th class="pb-3 pr-4">Status</th>
                <th class="pb-3 pr-4">Description</th>
                <th class="pb-3">Actions</th>
              </tr>
            </thead>
            <tbody id="paths-table-body" class="divide-y divide-gray-700">
              <tr>
                <td colspan="6" class="py-4 text-gray-400 text-center">Loading paths...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Add New Path Form -->
      <div class="bg-gray-800 rounded-lg p-6 mb-6">
        <h3 class="text-lg font-medium mb-4">Add New Documentation Path</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="new-path-name" class="block text-sm font-medium mb-2">Name</label>
            <input type="text" id="new-path-name" placeholder="My Documentation"
              class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
          <div>
            <label for="new-path-input" class="block text-sm font-medium mb-2">Path</label>
            <input type="text" id="new-path-input" placeholder="/path/to/documents"
              class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
          </div>
        </div>
        <div class="mb-4">
          <label for="new-path-description" class="block text-sm font-medium mb-2">Description (Optional)</label>
          <input type="text" id="new-path-description" placeholder="Description of this documentation path"
            class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
        </div>
        <div class="flex gap-4 items-end">
          <div class="flex-1">
            <div id="path-validation-message" class="text-sm"></div>
          </div>
          <button id="validate-btn" class="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-colors">
            Validate
          </button>
          <button id="add-path-button" disabled
            class="px-6 py-2 bg-primary hover:bg-blue-600 rounded-lg transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
            Add Path
          </button>
        </div>
      </div>
      <!-- Global Actions -->
      <div class="flex gap-4">
        <button id="save-btn" class="px-6 py-3 bg-success hover:bg-green-600 rounded-lg font-medium transition-colors">
          💾 Save Configuration
        </button>
        <button id="reindex-btn"
          class="px-6 py-3 bg-gray-700 hover:bg-gray-600 rounded-lg font-medium transition-colors">
          🔄 Reindex All
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script type="module">
    import { api } from '/admin/js/api.js';
    import { ui } from '/admin/js/ui.js';

    let pathValidationResult = null;

    // Load paths
    async function loadPaths() {
      try {
        const response = await api.getPaths();
        if (response.success) {
          renderPathsTable(response.data);
        } else {
          ui.showToast('Error loading paths: ' + response.message, 'error');
        }
      } catch (error) {
        ui.showToast('Error loading paths: ' + error.message, 'error');
      }
    }

    function renderPathsTable(data) {
      const tbody = document.getElementById('paths-table-body');
      const allPaths = [];

      // Add fixed paths (from .env)
      if (data.envPaths && data.envPaths.length > 0) {
        data.envPaths.forEach(path => {
          allPaths.push({
            id: 'env-' + btoa(path).replace(/[^a-zA-Z0-9]/g, ''), // Generate pseudo-id for env paths
            name: 'Environment Path',
            path: path,
            description: 'Fixed path from .env configuration',
            isActive: true,
            type: 'fixed',
            createdAt: null,
            updatedAt: null
          });
        });
      }

      // Add dynamic paths (from JSON)
      if (data.dynamicPaths && data.dynamicPaths.length > 0) {
        data.dynamicPaths.forEach(path => {
          allPaths.push({
            ...path,
            type: 'dynamic'
          });
        });
      }

      if (allPaths.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="py-4 text-gray-400 text-center">No paths configured</td></tr>';
        return;
      }

      tbody.innerHTML = allPaths.map(pathInfo => {
        const typeBadge = pathInfo.type === 'fixed'
          ? '<span class="px-2 py-1 bg-blue-500/20 text-blue-400 rounded text-xs">Fixed</span>'
          : '<span class="px-2 py-1 bg-green-500/20 text-green-400 rounded text-xs">Dynamic</span>';

        const statusBadge = pathInfo.isActive !== false
          ? '<span class="px-2 py-1 bg-success/20 text-success rounded text-xs">✓ Active</span>'
          : '<span class="px-2 py-1 bg-gray-500/20 text-gray-400 rounded text-xs">Inactive</span>';

        const actions = pathInfo.type === 'dynamic'
          ? `<button data-id="${pathInfo.id}" class="delete-btn text-error hover:text-red-400 text-sm">Delete</button>`
          : '<span class="text-gray-500 text-sm">Fixed</span>';

        return `
                <tr>
                    <td class="py-3 pr-4">${typeBadge}</td>
                    <td class="py-3 pr-4 font-medium">${pathInfo.name || 'N/A'}</td>
                    <td class="py-3 pr-4 font-mono text-sm">${pathInfo.path}</td>
                    <td class="py-3 pr-4">${statusBadge}</td>
                    <td class="py-3 pr-4 text-gray-300 text-sm">${pathInfo.description || ''}</td>
                    <td class="py-3">${actions}</td>
                </tr>
            `;
      }).join('');

      // Add event listeners to delete buttons
      document.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', () => removePath(btn.dataset.id));
      });
    }

    // Validate path
    async function validatePath() {
      const pathInput = document.getElementById('new-path-input');
      const nameInput = document.getElementById('new-path-name');
      const message = document.getElementById('path-validation-message');
      const addButton = document.getElementById('add-path-button');
      const path = pathInput.value.trim();
      const name = nameInput.value.trim();

      if (!path || !name) {
        message.innerHTML = '';
        addButton.disabled = true;
        return;
      }

      message.innerHTML = '<span class="text-gray-400">⏳ Validating...</span>';
      addButton.disabled = true;

      try {
        const result = await api.validatePath(path);
        pathValidationResult = result;

        if (result.valid) {
          message.innerHTML = `<span class="text-success">✓ ${result.message}</span>`;
          addButton.disabled = false;
        } else {
          message.innerHTML = `<span class="text-error">✗ ${result.message}</span>`;
          addButton.disabled = true;
        }
      } catch (error) {
        message.innerHTML = `<span class="text-error">✗ Error validating path: ${error.message}</span>`;
        addButton.disabled = true;
      }
    }

    // Add path
    async function addPath() {
      const nameInput = document.getElementById('new-path-name');
      const pathInput = document.getElementById('new-path-input');
      const descriptionInput = document.getElementById('new-path-description');

      const name = nameInput.value.trim();
      const path = pathInput.value.trim();
      const description = descriptionInput.value.trim();

      if (!name || !path || !pathValidationResult?.valid) return;

      try {
        const result = await api.addPath(name, path, description);

        if (result.success) {
          ui.showToast(result.message, 'success');
          nameInput.value = '';
          pathInput.value = '';
          descriptionInput.value = '';
          document.getElementById('path-validation-message').innerHTML = '';
          document.getElementById('add-path-button').disabled = true;
          pathValidationResult = null;
          loadPaths();
        } else {
          ui.showToast('Error: ' + result.message, 'error');
        }
      } catch (error) {
        ui.showToast('Error adding path: ' + error.message, 'error');
      }
    }

    // Remove path
    async function removePath(id) {
      if (!confirm('Are you sure you want to delete this path?')) return;

      try {
        const result = await api.removePath(id);

        if (result.success) {
          ui.showToast('Path deleted successfully', 'success');
          loadPaths();
        } else {
          ui.showToast('Error deleting path: ' + result.message, 'error');
        }
      } catch (error) {
        ui.showToast('Error deleting path: ' + error.message, 'error');
      }
    }

    // Reindex
    async function reindexAll() {
      if (!confirm('Reindex all documents? This may take some time.')) return;

      try {
        const result = await api.reindexAll();
        if (result.success) {
          ui.showToast(`Reindexación completada: ${result.totalDocs} documentos`, 'success');
        } else {
          ui.showToast('Error en reindexación', 'error');
        }
      } catch (error) {
        ui.showToast('Error: ' + error.message, 'error');
      }
    }

    // Event Listeners
    document.getElementById('validate-btn').addEventListener('click', validatePath);
    document.getElementById('add-path-button').addEventListener('click', addPath);
    document.getElementById('new-path-input').addEventListener('blur', validatePath);
    document.getElementById('new-path-name').addEventListener('blur', validatePath);
    document.getElementById('reindex-btn').addEventListener('click', reindexAll);
    document.getElementById('save-btn').addEventListener('click', () => ui.showToast('Configuration saved', 'success'));

    // Init
    loadPaths();
  </script>
</body>

</html>
